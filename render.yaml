services:
  - type: web
    name: vico-baocao
    env: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    disk:
      name: vico-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ENV
        value: production
      - key: VICO_DB_PATH
        value: /var/data/vico_production.db
      - key: VICO_MASTER_PATH
        value: /var/data/bao_cao_tong_hop.xlsx
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_BOOTSTRAP_USERNAME
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
